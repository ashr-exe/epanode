name: Publish signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.2.0
        required: true
        type: string
      prerelease:
        description: Mark as an evaluation prerelease
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      IS_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Validate tag and signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo 'Configure the four Android signing secrets described in docs/RELEASING.md.' >&2
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint, and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_dir/release.jks"
          apk="Epanode-${RELEASE_TAG#v}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$key_dir/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > APK-SIGNATURE.txt
          actual="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          expected="${RELEASE_TAG#v}"
          test "$actual" = "${expected%%-*}"
      - name: Package corresponding source and checksums
        run: |
          git archive --format=zip --prefix=Epanode/ --output="Epanode-${RELEASE_TAG#v}-source.zip" "$RELEASE_TAG"
          sha256sum "Epanode-${RELEASE_TAG#v}.apk" "Epanode-${RELEASE_TAG#v}-source.zip" APK-SIGNATURE.txt > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=(--verify-tag --title "Epanode ${RELEASE_TAG#v}")
          if [ "$IS_PRERELEASE" = true ]; then args+=(--prerelease); fi
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$RELEASE_TAG" "Epanode-${RELEASE_TAG#v}.apk" "Epanode-${RELEASE_TAG#v}-source.zip" SHA256SUMS.txt APK-SIGNATURE.txt "${args[@]}"
